<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fgdgfdgf</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  cursor: crosshair;
}

/* ===== 背景系统 ===== */
.bg-container {
  position: fixed;
  inset: -30px; /* 比视口大，为视差位移留余地 */
  z-index: 0;
  will-change: transform;
}

.bg-img {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 0.9s ease-in-out;
}
.bg-img.active { opacity: 1; }

/* 默认背景 */
.bg-img.default {
  background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1920&q=80');
}

/* 深色遮罩 */
.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0.2) 0%,
    rgba(0,0,0,0.85) 100%
  );
}

/* 噪点胶片质感 */
.noise {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* ===== 内容层 ===== */
.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 20px;
}

.title {
  color: #fff;
  font-size: clamp(16px, 3vw, 36px);
  font-weight: 300;
  letter-spacing: 14px;
  margin-bottom: clamp(28px, 5vh, 60px);
  text-transform: uppercase;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  animation: fadeInDown 1.2s ease-out;
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 链接列表 */
nav {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 2vh, 18px);
  width: min(92vw, 640px);
}

/* 毛玻璃外框 */
.link-wrapper {
  overflow: hidden;
  border-radius: 6px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  animation: fadeInUp 0.8s ease-out backwards;
  transition: background 0.3s, border-color 0.3s;
}
.link-wrapper:nth-child(1) { animation-delay: 0.1s; }
.link-wrapper:nth-child(2) { animation-delay: 0.2s; }
.link-wrapper:nth-child(3) { animation-delay: 0.3s; }
.link-wrapper:nth-child(4) { animation-delay: 0.4s; }

.link-wrapper:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.12);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 链接本体 */
.link {
  position: relative;
  display: block;
  text-align: center;
  text-decoration: none;
  color: #fff;
  font-size: clamp(32px, 7.5vw, 80px);
  font-weight: 900;
  letter-spacing: 4px;
  padding: clamp(10px, 2vh, 16px) 16px;
  line-height: 1.05;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  transition: transform 0.4s cubic-bezier(.7,0,.3,1);
  overflow: hidden;
}

/* 悬停彩色背景 */
.link::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ff2e93, #ff9a00);
  transform: scaleY(0);
  transform-origin: bottom;
  transition: transform 0.5s cubic-bezier(.7,0,.3,1);
  z-index: 0;
}

/* 下划线 */
.link::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 6px;
  width: 70%;
  height: 4px;
  transform: translateX(-50%) scaleX(0);
  transition: transform 0.5s cubic-bezier(.7,0,.3,1);
  border-radius: 2px;
  z-index: 0;
}

.link:nth-child(1)::after { background: #00e5ff; }
.link:nth-child(2)::after { background: #ff2e93; }
.link:nth-child(3)::after { background: #ffd200; }
.link:nth-child(4)::after { background: #7CFF6B; }

/* 文字在上层 */
.link span {
  position: relative;
  z-index: 1;
}

.link:hover {
  transform: scale(1.03) translateX(6px);
}
.link:hover::before { transform: scaleY(1); }
.link:hover::after { transform: translateX(-50%) scaleX(1); }

/* 底部提示 */
.footer {
  margin-top: clamp(28px, 5vh, 60px);
  color: rgba(255,255,255,0.25);
  font-size: 11px;
  letter-spacing: 5px;
  z-index: 10;
  animation: fadeIn 1.5s ease-out 0.8s both;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* 加载画面 */
.loader {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #0a0a0a;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: opacity 0.6s, visibility 0.6s;
}
.loader.hidden {
  opacity: 0;
  visibility: hidden;
}
.loader-text {
  color: #fff;
  font-size: 13px;
  letter-spacing: 10px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<!-- 加载画面 -->
<div class="loader">
  <div class="loader-text">ENTER</div>
</div>

<!-- 背景系统 -->
<div class="bg-container" id="bgContainer">
  <div class="bg-img default active"></div>
  <div class="bg-img" data-src="http://kjrranxx.r.hzmyjd.cn/s/15G7aG"></div>
  <div class="bg-img" data-src="https://drh.likeduoduiyi.cn/1eb7f9580408615191260fc25e3e3f97?code=aubr96"></div>
  <div class="bg-img" data-src="http://rk1.4u8.cn/rk1.html?u=bucket_6963c3bfb0d48"></div>
  <div class="bg-img" data-src="https://zps.cdgeek.net/JZ_img/d24237cb-edae-4de6-9bd0-9266e337e24f.html?atecode=MTAxLEY4a3NaLDY"></div>
</div>
<div class="bg-overlay"></div>
<div class="noise"></div>

<!-- 内容 -->
<div class="content">
  <h1 class="title">寂寞 · 忘情水</h1>
  <nav>
    <div class="link-wrapper"><a class="link" href="#nature" data-index="1"><span>巨 乳</span></a></div>
    <div class="link-wrapper"><a class="link" href="#city" data-index="2"><span>黑 丝</span></a></div>
    <div class="link-wrapper"><a class="link" href="#art" data-index="3"><span>制 服</span></a></div>
    <div class="link-wrapper"><a class="link" href="#vision" data-index="4"><span>调 教</span></a></div>
  </nav>
  <div class="footer">AN EMPTY · FEELING</div>
</div>

<script>
// ===== 预加载所有背景图 =====
document.querySelectorAll('.bg-img[data-src]').forEach(img => {
  const src = img.getAttribute('data-src');
  img.style.backgroundImage = `url('${src}')`;
});

// ===== 鼠标视差 =====
const bgContainer = document.getElementById('bgContainer');
let targetX = 0, targetY = 0;
let currentX = 0, currentY = 0;

document.addEventListener('mousemove', (e) => {
  targetX = (e.clientX / window.innerWidth - 0.5) * 2;
  targetY = (e.clientY / window.innerHeight - 0.5) * 2;
});

function animateParallax() {
  currentX += (targetX - currentX) * 0.04;
  currentY += (targetY - currentY) * 0.04;
  bgContainer.style.transform = `translate(${-currentX * 18}px, ${-currentY * 18}px)`;
  requestAnimationFrame(animateParallax);
}
animateParallax();

// ===== 悬停切换背景 =====
const links = document.querySelectorAll('.link');
const bgImgs = document.querySelectorAll('.bg-img');

links.forEach(link => {
  link.addEventListener('mouseenter', () => {
    const idx = parseInt(link.getAttribute('data-index'));
    bgImgs.forEach((img, i) => {
      img.classList.toggle('active', i === idx);
    });
  });

  link.addEventListener('mouseleave', () => {
    bgImgs.forEach((img, i) => {
      img.classList.toggle('active', i === 0);
    });
  });
});

// ===== 隐藏加载画面 =====
window.addEventListener('load', () => {
  setTimeout(() => {
    document.querySelector('.loader').classList.add('hidden');
  }, 400);
});
</script>

</body>
</html>
